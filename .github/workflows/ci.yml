name: ci

# Por que existe: hasta el 20/07/2026 este repo no tenia CI. El CI es la unica
# vigilancia que sobrevive a que la maquina del autor este apagada.
#
# La suite se verifico en verde en local antes de cablear esto. Las versiones de la
# matriz no se probaron en local.
#
# Nota honesta sobre el alcance: `probar_todo.py` cubre el motor (descomposicion,
# backtesting, ratios, aging). Una auditoria del 20/07 midio que la suite NO detecta
# ciertas regresiones — sobreviven mutantes que rompen la escala del MASE o inyectan
# fuga temporal en el backtesting. Este CI evita que se rompa lo que la suite SI mira;
# no certifica lo que la suite no cubre.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Biblioteca estandar unicamente.
      - name: Suite completa (forecast + backtesting + ratios + aging)
        run: python probar_todo.py
