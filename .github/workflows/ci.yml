name: ci

# Por que existe: hasta el 20/07/2026 este repo no tenia CI. El CI es la unica
# vigilancia que sobrevive a que la maquina del autor este apagada.
#
# La suite se verifico en verde en local antes de cablear esto. Las versiones de la
# matriz no se probaron en local.
#
# Alcance: `probar_todo.py` cubre el motor (descomposicion, backtesting con dos
# referencias, ratios, aging). Desde el 10/11/2026 sus controles caen si se rompe la
# escala del MASE, si el backtesting mira el futuro, si a h>1 no se mide la suma del
# horizonte, si falla la referencia con tendencia o si un ratio se calcula mal: se
# comprobo metiendo doce errores a proposito, uno por copia, y los doce se detectaron.
# El segundo paso ejecuta con una consola que solo admite ASCII, como la de Windows
# en algunos equipos.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Biblioteca estandar unicamente.
      - name: Suite completa (forecast + backtesting + ratios + aging)
        run: python -W error probar_todo.py

      - name: La misma suite con consola ASCII
        env:
          PYTHONIOENCODING: ascii
        run: python -W error probar_todo.py
